name: timeseries-forecast-lab

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-timeseries}
      POSTGRES_USER: ${POSTGRES_USER:-timeseries}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command:
      - uv
      - run
      - uvicorn
      - app.main:app
      - --reload
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    env_file:
      - .env
    environment:
      TIMESFM_BACKEND: pytorch
      TIMESFM_CHECKPOINT_PATH: /models/timesfm
      TIMESFM_DEVICE: cpu
      TRACKING_DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-timeseries}@postgres:5432/${POSTGRES_DB:-timeseries}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - type: bind
        source: ${TIMESFM_CHECKPOINT_HOST_PATH}
        target: /models/timesfm
        read_only: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/health/ready", timeout=5)
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 180s
    depends_on:
      postgres:
        condition: service_healthy

  tracking-migration:
    profiles:
      - migration
    build:
      context: ./backend
      dockerfile: Dockerfile.migration
    command:
      - --sqlite-path
      - data/tracking.sqlite3
    environment:
      TRACKING_DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-timeseries}@postgres:5432/${POSTGRES_DB:-timeseries}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_started

volumes:
  frontend_node_modules:
  postgres_data:
