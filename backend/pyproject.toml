[project]
name = "timeseries-stock-api"
version = "0.1.0"
description = "FastAPI backend for local TimesFM stock trend forecasts."
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "numpy>=1.26,<3",
  "pandas-market-calendars>=5.5,<6",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
]
timesfm-mlx = [
  "timesfm[mlx]==3.0.2",
]
timesfm-pytorch = [
  "timesfm[torch]==3.0.2",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
